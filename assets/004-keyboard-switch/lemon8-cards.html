<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="tokens.css"><style>
*{box-sizing:border-box}html,body,#app{margin:0;width:1080px;height:1440px;overflow:hidden}body{font-family:var(--thai);color:var(--ink);background:var(--paper)}
.card{width:1080px;height:1440px;position:relative;padding:82px 76px;background:var(--paper);overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 47px,#d9d9d3 48px,transparent 49px),radial-gradient(circle,#d9d9d3 1.1px,transparent 1.2px);background-size:auto,32px 32px;opacity:.45;pointer-events:none}.card>*{position:relative}.card.cover{background:#142547;color:#fff}.card.cover:before{opacity:.12}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:32px}.eyebrow{font:700 26px/1.3 var(--mono);letter-spacing:.025em;color:var(--blue);max-width:690px}.cover .eyebrow{color:#abc0ff}.count{font:700 25px/1 var(--mono);color:var(--blue)}.cover .count{color:#abc0ff}.title{font-size:72px;line-height:1.11;letter-spacing:-.035em;margin:42px 0 24px;max-width:925px}.cover .title{font-size:76px;margin-top:105px}.lead{font-size:37px;line-height:1.42;color:var(--muted);margin:0;max-width:920px}.cover .lead{color:#e2e9ff}.footer{position:absolute;bottom:62px;left:76px;right:76px;border-top:2px solid var(--line);padding-top:22px;font-size:28px;line-height:1.3;color:var(--muted)}.cover .footer{color:#d9e2fb;border-color:#6376a9}.signal{margin-top:34px;padding:24px 32px;background:var(--blue);color:white;font-size:34px;line-height:1.3;font-weight:700}.cover .signal{background:#e4ecff;color:#142547}.panel{background:var(--panel);border:2px solid var(--line);border-radius:22px}.items{display:grid;gap:20px;margin-top:35px}.item{font-size:36px;line-height:1.34;padding:22px 28px;border-left:6px solid var(--blue);background:var(--panel)}
.cover-visual{height:440px;margin-top:58px;display:flex;gap:16px;align-items:flex-end}.cover-unit{flex:1;min-width:0;padding:18px 12px 24px;background:#21365f;border:2px solid #798dc1;border-radius:20px;color:#fff;font:700 29px/1.2 var(--mono);text-align:center}.cover-unit .switch-art{display:block;width:100%;height:285px;margin-bottom:13px}.cover-unit:nth-child(2){background:#315ad5}.cover-unit:nth-child(3){background:#475ac0}.cover-art-note{margin-top:10px;text-align:center;color:#c7d4f2;font-size:24px}
.anatomy-track{position:relative;height:340px;margin:78px 0 54px;background:var(--panel);border:2px solid var(--line);border-radius:24px}.anatomy-line{position:absolute;left:75px;right:75px;top:165px;height:12px;background:#bcc9ef;border-radius:8px}.anatomy-points{position:absolute;left:70px;right:70px;top:124px;display:flex;justify-content:space-between}.anatomy-point{width:90px;height:90px;border:9px solid var(--blue);border-radius:50%;background:var(--panel)}.anatomy-point:nth-child(2){background:var(--blue)}.anatomy-labels{position:absolute;left:30px;right:30px;bottom:30px;display:flex;justify-content:space-between}.anatomy-labels span{width:31%;font-size:30px;line-height:1.2;text-align:center;font-weight:700}
.switch-hero{height:480px;margin:38px 0 20px;padding:20px 28px;display:grid;grid-template-columns:470px 1fr;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:22px}.switch-hero .switch-art{width:430px;height:405px}.switch-descriptor{display:flex;flex-direction:column;gap:26px}.switch-color-label{font-size:29px;line-height:1.3;color:var(--muted)}.switch-feel-label{font-size:48px;line-height:1.16;font-weight:700}.switch-art-note{font-size:22px;line-height:1.3;color:var(--muted)}.switch .items{margin-top:24px}.switch .item{font-size:33px;padding:19px 26px}.switch .signal{font:700 30px/1.3 var(--thai)}
.colors-card .title{font-size:63px}.colors-primary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:42px}.color-example{padding:13px;background:var(--panel);border:2px solid var(--line);border-radius:17px;text-align:center}.color-example .switch-art{width:100%;height:210px}.color-name{font-size:34px;font-weight:700;margin:4px 0}.color-type{font:700 24px/1.2 var(--mono);color:var(--blue)}.alternate-label{font-size:34px;font-weight:700;margin:35px 0 16px}.alternate-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.alternate{display:flex;gap:14px;align-items:center;padding:17px;background:#fff;border:2px solid var(--line);font-size:29px;line-height:1.2}.alternate i{width:48px;height:48px;flex:0 0 48px;border:3px solid var(--ink);border-radius:9px}.alternate b{display:block;font:700 22px/1.2 var(--mono);color:var(--blue)}.colors-card .signal{margin-top:32px;font-size:30px}
.dimensions{display:grid;gap:14px;margin-top:42px}.dimension{display:grid;grid-template-columns:65px 205px 1fr;gap:16px;align-items:center;padding:26px 22px;background:var(--panel);border-top:3px solid var(--blue)}.dimension i{font:700 25px/1 var(--mono);font-style:normal;color:var(--blue)}.dimension b{font:700 28px/1.2 var(--mono)}.dimension span{font-size:31px;line-height:1.3}
.system-ring{height:530px;position:relative;margin:28px 0 8px}.system-center{position:absolute;left:270px;top:160px;width:390px;height:200px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--blue);color:white;font-size:40px;font-weight:700;z-index:2}.system-tag{position:absolute;padding:19px 26px;border:2px solid var(--blue);background:var(--panel);border-radius:50px;font:700 28px/1.1 var(--mono);z-index:2}.system-tag:nth-child(2){left:20px;top:30px}.system-tag:nth-child(3){right:20px;top:30px}.system-tag:nth-child(4){left:5px;top:395px}.system-tag:nth-child(5){right:0;top:395px}.system-tag:nth-child(6){left:335px;top:0}.system-ring:before,.system-ring:after{content:"";position:absolute;left:130px;right:130px;top:260px;border-top:3px dashed #a6b8f7;transform:rotate(30deg)}.system-ring:after{transform:rotate(-30deg)}.system .signal{margin-top:12px;font-size:31px}
.choices{display:grid;gap:18px;margin-top:95px}.choice{display:grid;grid-template-columns:1.5fr .8fr;min-height:160px;background:var(--panel);border:2px solid var(--line);border-radius:18px;overflow:hidden}.choice span{padding:30px;font-size:36px;line-height:1.25;display:flex;align-items:center}.choice b{display:flex;align-items:center;justify-content:center;background:var(--pale);border-left:2px solid var(--line);font:700 30px/1.2 var(--mono);color:var(--blue)}.choice:last-child b{background:var(--blue);color:white}.choice-card .signal{margin-top:60px}
.recap-steps{display:grid;gap:18px;margin-top:80px}.recap-step{display:flex;align-items:center;gap:28px;min-height:150px;padding:25px 35px;background:var(--panel);border:2px solid var(--line);font-size:38px;font-weight:700}.recap-step i{display:flex;align-items:center;justify-content:center;flex:0 0 62px;width:62px;height:62px;border-radius:50%;background:var(--blue);color:white;font:700 26px/1 var(--mono);font-style:normal}.recap-step:last-child{border-color:var(--blue)}.recap .signal{margin-top:40px}
</style></head><body><main id="app"></main><script id="data" type="application/json">__CARD_DATA__</script><script>
const model=JSON.parse(document.getElementById('data').textContent);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const txt=v=>esc(v).replace(/\n/g,'<br>');
function base(c,inner,cls=''){return `<section class="card ${cls}"><div class="top"><div class="eyebrow">${txt(c.eyebrow)}</div><div class="count">${String(c.order).padStart(2,'0')}/${String(model.cards.length).padStart(2,'0')}</div></div><h1 class="title">${txt(c.title)}</h1>${c.lead?`<p class="lead">${txt(c.lead)}</p>`:''}${inner}<div class="footer">${txt(c.footer)}</div></section>`}
function switchArt(color){const fill=/^#[0-9a-fA-F]{6}$/.test(color)?color:'#777777';return `<svg class="switch-art" viewBox="0 0 360 360" aria-hidden="true"><defs><linearGradient id="housing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fb"/><stop offset="1" stop-color="#bcc6d0"/></linearGradient><linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d99a7"/><stop offset="1" stop-color="#536171"/></linearGradient></defs><ellipse cx="181" cy="322" rx="143" ry="19" fill="#0f2233" opacity=".16"/><path d="M74 218h211v76q0 18-18 18H92q-18 0-18-18z" fill="url(#base)" stroke="#40505c" stroke-width="5"/><rect x="35" y="110" width="290" height="152" rx="28" fill="url(#housing)" stroke="#526273" stroke-width="6"/><path d="M35 139H13v73h22M325 139h22v73h-22" fill="#b1bbc5" stroke="#526273" stroke-width="5"/><rect x="80" y="84" width="201" height="136" rx="19" fill="#a2aeba" stroke="#5d6976" stroke-width="5"/><rect x="101" y="99" width="159" height="112" rx="13" fill="#e6ebef" stroke="#7b8995" stroke-width="4"/><path d="M149 91h61v40h40v51h-40v39h-61v-39h-40v-51h40z" fill="${fill}" stroke="#233340" stroke-width="5" stroke-linejoin="round"/><path d="M158 102h43v110h-43z" fill="#fff" opacity=".16"/><path d="M95 285h170" stroke="#aeb9c5" stroke-width="5" stroke-linecap="round"/><path d="M131 312v18m98-18v18" stroke="#8e989f" stroke-width="9" stroke-linecap="round"/></svg>`}
function cover(c){return base(c,`<div class="cover-visual">${c.labels.map((l,i)=>`<div class="cover-unit">${switchArt(c.stem_colors[i])}<span>${txt(l)}</span></div>`).join('')}</div><div class="cover-art-note">${txt(c.art_note)}</div><div class="signal">${txt(c.signal)}</div>`,'cover')}
function anatomy(c){return base(c,`<div class="anatomy-track"><div class="anatomy-line"></div><div class="anatomy-points">${c.labels.map(()=>'<span class="anatomy-point"></span>').join('')}</div><div class="anatomy-labels">${c.labels.map(l=>`<span>${txt(l)}</span>`).join('')}</div></div><div class="items">${c.items.map(v=>`<div class="item">${txt(v)}</div>`).join('')}</div>`)}
function sw(c){return base(c,`<div class="switch-hero">${switchArt(c.stem_hex)}<div class="switch-descriptor"><div class="switch-color-label">${txt(c.color_label)}</div><div class="switch-feel-label">${txt(c.feel_label)}</div><div class="switch-art-note">${txt(c.art_note)}</div></div></div><div class="items">${c.items.map(v=>`<div class="item">${txt(v)}</div>`).join('')}</div><div class="signal">${txt(c.signal)}</div>`,'switch')}
function colors(c){return base(c,`<div class="colors-primary">${c.primary_colors.map(([hex,name,type])=>`<div class="color-example">${switchArt(hex)}<div class="color-name">${txt(name)}</div><div class="color-type">${txt(type)}</div></div>`).join('')}</div><div class="alternate-label">${txt(c.alternate_label)}</div><div class="alternate-grid">${c.alternate_colors.map(([hex,name,type])=>`<div class="alternate"><i style="background:${/^#[0-9a-fA-F]{6}$/.test(hex)?hex:'#777777'}"></i><span>${txt(name)}<b>${txt(type)}</b></span></div>`).join('')}</div><div class="signal">${txt(c.signal)}</div>`,'colors-card')}
function dimensions(c){return base(c,`<div class="dimensions">${c.items.map(([n,l,d])=>`<div class="dimension"><i>${txt(n)}</i><b>${txt(l)}</b><span>${txt(d)}</span></div>`).join('')}</div>`)}
function system(c){return base(c,`<div class="system-ring"><div class="system-center">${txt(c.center)}</div>${c.items.map(v=>`<div class="system-tag">${txt(v)}</div>`).join('')}</div><div class="signal">${txt(c.signal)}</div>`,'system')}
function choice(c){return base(c,`<div class="choices">${c.choices.map(([q,a])=>`<div class="choice"><span>${txt(q)}</span><b>${txt(a)}</b></div>`).join('')}</div><div class="signal">${txt(c.signal)}</div>`,'choice-card')}
function recap(c){return base(c,`<div class="recap-steps">${c.steps.map((s,i)=>`<div class="recap-step"><i>${i+1}</i><span>${txt(s)}</span></div>`).join('')}</div><div class="signal">${txt(c.signal)}</div>`,'recap')}
const handlers={cover,anatomy,switch:sw,colors,dimensions,system,choice,recap};const n=Number(new URLSearchParams(location.search).get('card')||1);const card=model.cards.find(c=>c.order===n)||model.cards[0];document.getElementById('app').innerHTML=handlers[card.template](card);
</script></body></html>
