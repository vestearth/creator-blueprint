<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
/* Hallmark · genre: atmospheric · macrostructure: Map / Diagram · theme: Terminal · enrichment: Tier-A CSS data map
 * Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V5 · contrast: pass (40–41) · slop: pass (42–49)
 */
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1440px;overflow:clip}body{font-family:var(--font-body);background:var(--color-canvas);color:var(--color-ink)}
.card{position:relative;width:1080px;height:1440px;padding:var(--space-2xl);background-color:var(--color-canvas);background-image:radial-gradient(circle,var(--color-grid) 1.5px,var(--color-transparent) 1.5px);background-size:32px 32px;overflow:clip}.card:before{content:"";position:absolute;left:32px;top:72px;bottom:72px;width:var(--rule-thin);background:var(--color-accent-dim)}.card:after{content:"SYS/002";position:absolute;right:24px;bottom:210px;writing-mode:vertical-rl;font:700 var(--text-xs)/1 var(--font-mono);letter-spacing:.16em;color:var(--color-rule)}
.num{position:absolute;right:var(--space-2xl);top:var(--space-2xl);z-index:4;width:190px;white-space:nowrap;text-align:right;font:700 var(--text-xs)/1 var(--font-mono);color:var(--color-accent);background:var(--color-canvas);padding-left:var(--space-md)}.eyebrow{max-width:730px;font:700 var(--text-sm)/1.25 var(--font-mono);color:var(--color-accent);letter-spacing:.045em}.title{min-width:0;max-width:920px;margin:var(--space-md) 0 var(--space-sm);font:700 var(--text-display-s)/1.12 var(--font-display);letter-spacing:-.035em;overflow-wrap:anywhere}.lead{max-width:65ch;margin:0 0 var(--space-lg);font-size:var(--text-lg);line-height:1.42;color:var(--color-muted)}.footer{position:absolute;left:var(--space-2xl);right:var(--space-2xl);bottom:52px;z-index:3;padding-top:var(--space-sm);border-top:var(--rule-thin) solid var(--color-rule);font:400 var(--text-sm)/1.45 var(--font-body);color:var(--color-muted)}.footer:before{content:">";margin-right:var(--space-xs);font-family:var(--font-mono);color:var(--color-accent)}
.panel{border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-panel);background:var(--color-surface)}.mono{font-family:var(--font-mono)}.signal{display:inline-block;padding:var(--space-sm) var(--space-md);border-top:var(--rule-thin) solid var(--color-accent);background:var(--color-surface-2);color:var(--color-ink);font-size:var(--text-md);line-height:1.3;font-weight:700}.note{margin:var(--space-md) 0;color:var(--color-muted);font-size:var(--text-sm);line-height:1.45}.arrow{font:700 var(--text-lg)/1 var(--font-mono);color:var(--color-accent)}
.cover{background-color:var(--color-canvas)}.cover .title{font-size:var(--text-display);line-height:1.05;margin-top:var(--space-xl)}.cover .lead{color:var(--color-ink)}.cover .signal{background:var(--color-accent);color:var(--color-accent-ink);border:0}.cover-viz{height:455px;margin:var(--space-md) 0 var(--space-lg);display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1.2fr);gap:var(--space-sm);align-items:center}.cover-path,.cover-loop{height:340px;padding:var(--space-md);display:flex;align-items:center;justify-content:center;position:relative;border-top:var(--rule-thin) solid var(--color-rule);border-bottom:var(--rule-thin) solid var(--color-rule)}.cover-path{gap:var(--space-xs)}.cover-path .dot{width:42px;height:42px;border:var(--rule-thin) solid var(--color-muted);border-radius:50%}.cover-loop .ring{width:240px;height:240px;border:8px solid var(--color-accent);border-right-color:var(--color-rule);border-radius:50%;position:relative}.cover-loop .ring:after{content:"";position:absolute;right:-11px;top:35px;border-left:22px solid var(--color-accent);border-top:14px solid var(--color-transparent);border-bottom:14px solid var(--color-transparent);transform:rotate(-18deg)}.cover-label{position:absolute;left:0;right:0;bottom:var(--space-sm);text-align:center;font:700 var(--text-xs)/1 var(--font-mono);color:var(--color-muted)}.neq{text-align:center;font:700 var(--text-xl)/1 var(--font-mono);color:var(--color-accent)}
.path{height:250px;margin:var(--space-xl) 0;display:flex;align-items:center;justify-content:center;gap:var(--space-sm);position:relative}.path:before{content:"";position:absolute;left:80px;right:80px;top:50%;height:var(--rule-thin);background:var(--color-accent-dim)}.node{position:relative;z-index:1;min-width:220px;height:104px;padding:var(--space-sm);display:flex;align-items:center;justify-content:center;border:var(--rule-thin) solid var(--color-accent);border-radius:var(--radius-node);background:var(--color-canvas);font:700 var(--text-md)/1.2 var(--font-mono);text-align:center}.path-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-md)}.path-body .panel{padding:var(--space-md);font-size:var(--text-md);line-height:1.45}.cursor-card{margin-top:var(--space-md);padding:var(--space-sm) var(--space-md);border-top:var(--rule-thin) solid var(--color-accent);background:var(--color-surface);font-size:var(--text-md);line-height:1.4}
.loop-wrap{height:570px;position:relative;margin-top:var(--space-xs)}.loop-ring{position:absolute;width:510px;height:510px;border:7px solid var(--color-rule);border-top-color:var(--color-accent);border-right-color:var(--color-accent);border-radius:50%;left:214px;top:28px}.loop-ring:after{content:"";position:absolute;right:8px;top:61px;border-left:26px solid var(--color-accent);border-top:17px solid var(--color-transparent);border-bottom:17px solid var(--color-transparent);transform:rotate(-12deg)}.loop-node{position:absolute;width:185px;height:78px;display:flex;align-items:center;justify-content:center;border:var(--rule-thin) solid var(--color-accent);border-radius:var(--radius-node);background:var(--color-canvas);font:700 var(--text-sm)/1 var(--font-mono)}.loop-node.goal{left:375px;top:4px}.loop-node.decide{left:650px;top:146px}.loop-node.act{left:568px;top:404px}.loop-node.observe{left:186px;top:404px}.loop-node.verify{left:102px;top:146px}.loop-center{position:absolute;left:344px;top:220px;width:250px;text-align:center;font-size:var(--text-lg);line-height:1.25;font-weight:700}.loop-signal{position:absolute;left:320px;bottom:0}
.versus{display:grid;grid-template-columns:minmax(0,1fr) 82px minmax(0,1fr);gap:var(--space-sm);align-items:stretch;margin-top:var(--space-lg)}.versus-panel{padding:var(--space-lg);min-height:560px}.versus-panel h2{margin:0 0 var(--space-lg);font:700 var(--text-sm)/1.2 var(--font-mono);color:var(--color-accent)}.versus-panel.right{background:var(--color-surface-2);border-color:var(--color-accent)}.v-item{padding:var(--space-md) 0;border-bottom:var(--rule-thin) solid var(--color-rule);font-size:var(--text-md);line-height:1.3}.versus-mark{display:flex;align-items:center;justify-content:center;font:700 var(--text-xl)/1 var(--font-mono);color:var(--color-accent)}
.stack{margin-top:var(--space-md);display:grid;gap:var(--space-xs)}.stack-row{display:grid;grid-template-columns:64px 190px 1fr;gap:var(--space-md);align-items:center;padding:var(--space-sm) var(--space-md);border-left:var(--rule-thin) solid var(--color-rule);background:var(--color-surface)}.stack-row:nth-child(even){margin-left:32px;border-left-color:var(--color-accent)}.stack-num{font:700 var(--text-xs)/1 var(--font-mono);color:var(--color-accent)}.stack-label{font:700 var(--text-sm)/1 var(--font-mono)}.stack-desc{font-size:var(--text-md);line-height:1.35}.workflow-band{margin-top:var(--space-md);padding:var(--space-sm) var(--space-md);border-top:var(--rule-thin) solid var(--color-accent);border-bottom:var(--rule-thin) solid var(--color-accent);color:var(--color-ink);font-size:var(--text-md);line-height:1.35}
.lanes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-lg);margin-top:var(--space-md);position:relative}.lanes:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:var(--rule-thin);background:var(--color-accent-dim)}.lane{padding:var(--space-lg);min-height:540px;border:0;border-radius:0;background:var(--color-transparent)}.lane h2{margin:0 0 var(--space-lg);font:700 var(--text-md)/1 var(--font-mono);color:var(--color-muted)}.lane.agent h2{color:var(--color-accent)}.lane-step{display:flex;align-items:center;gap:var(--space-sm);margin:var(--space-md) 0;font-size:26px;line-height:1.3}.lane-step i{flex:0 0 36px;width:36px;height:36px;border:var(--rule-thin) solid var(--color-rule);border-radius:50%;font-style:normal;font:700 17px/32px var(--font-mono);text-align:center}.lane.agent .lane-step i{border-color:var(--color-accent);color:var(--color-accent)}.report-note{margin-top:var(--space-md);padding:var(--space-sm) var(--space-md);border-top:var(--rule-thin) solid var(--color-warning);background:var(--color-surface);font-size:var(--text-sm);line-height:1.45}
.checklist{margin-top:var(--space-lg);display:grid;gap:0}.check{display:grid;grid-template-columns:56px 1fr;align-items:center;gap:var(--space-sm);padding:var(--space-md) 0;border-bottom:var(--rule-thin) solid var(--color-rule);background:var(--color-transparent);font-size:var(--text-lg);line-height:1.3}.check i{width:40px;height:40px;border:var(--rule-thin) solid var(--color-accent);border-radius:50%;position:relative}.check i:after{content:"✓";position:absolute;left:8px;top:-4px;color:var(--color-accent);font-weight:700}.simple-signal{margin-top:var(--space-xl)}
.use-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-sm);margin-top:var(--space-md)}.use{min-height:205px;padding:var(--space-md);border-top:var(--rule-thin) solid var(--color-rule);background:var(--color-surface)}.use:nth-child(2),.use:nth-child(3){border-top-color:var(--color-accent)}.use b{display:block;margin-bottom:var(--space-sm);font:700 var(--text-sm)/1 var(--font-mono);color:var(--color-accent)}.use span{font-size:var(--text-md);line-height:1.35}.agent-note{margin-top:var(--space-md);padding:var(--space-sm) var(--space-md);border:var(--rule-thin) dashed var(--color-warning);font-size:var(--text-sm);line-height:1.45;color:var(--color-muted)}
.bridge{height:500px;margin-top:var(--space-md);display:grid;grid-template-columns:220px 230px minmax(0,1fr);gap:var(--space-md);align-items:center;position:relative}.bridge:before{content:"";position:absolute;left:100px;right:50px;top:50%;height:var(--rule-thin);background:var(--color-accent-dim)}.agent-box{position:relative;z-index:1;height:220px;display:flex;align-items:center;justify-content:center;border:var(--rule-thin) solid var(--color-accent);background:var(--color-canvas);font:700 var(--text-md)/1 var(--font-mono)}.mcp-bridge{position:relative;z-index:1;height:100px;display:flex;align-items:center;justify-content:center;background:var(--color-accent);color:var(--color-accent-ink);font:700 var(--text-md)/1 var(--font-mono)}.systems{position:relative;z-index:1;display:grid;gap:var(--space-sm)}.system-node{padding:var(--space-md);border-top:var(--rule-thin) solid var(--color-accent);background:var(--color-surface);font:700 var(--text-sm)/1 var(--font-mono);text-align:center}.approval{position:absolute;left:342px;right:240px;bottom:310px;padding-top:var(--space-xs);border-top:var(--rule-thin) dashed var(--color-warning);text-align:center;color:var(--color-warning);font:700 var(--text-xs)/1 var(--font-mono)}
.decision{margin-top:var(--space-lg);display:grid;gap:var(--space-xs)}.choice{display:grid;grid-template-columns:1.5fr .8fr;border-bottom:var(--rule-thin) solid var(--color-rule);background:var(--color-surface)}.choice span{padding:var(--space-md);font-size:var(--text-md);line-height:1.3}.choice b{display:flex;align-items:center;justify-content:center;border-left:var(--rule-thin) solid var(--color-rule);color:var(--color-muted);font:700 var(--text-sm)/1 var(--font-mono)}.choice:last-child{border-color:var(--color-accent)}.choice:last-child b{background:var(--color-accent);color:var(--color-accent-ink)}.decision-signal{margin-top:var(--space-lg);width:100%;text-align:center}
</style>
</head>
<body><main id="app"></main>
<script id="card-data" type="application/json">__CARD_DATA__</script>
<script>
const model=JSON.parse(document.getElementById('card-data').textContent);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const txt=v=>esc(v).replace(/\n/g,'<br>');
const footer=c=>`<footer class="footer">${txt(c.footer)}</footer>`;
const shell=(c,body,classes='')=>`<section class="card ${classes}"><b class="num">${String(c.order).padStart(2,'0')}/${String(model.cards.length).padStart(2,'0')}</b><div class="eyebrow">${txt(c.eyebrow)}</div><h1 class="title">${txt(c.title)}</h1>${body}${footer(c)}</section>`;
function cover(c){return shell(c,`<p class="lead">${txt(c.lead)}</p><div class="cover-viz" role="img" aria-label="เปรียบเทียบเส้นทางตรงของแชตกับวงจรทำงานของเอเจนต์"><div class="cover-path"><i class="dot" aria-hidden="true"></i><span class="arrow" aria-hidden="true">→</span><i class="dot" aria-hidden="true"></i><b class="cover-label">PROMPT → ANSWER</b></div><div class="neq" aria-hidden="true">≠</div><div class="cover-loop"><i class="ring" aria-hidden="true"></i><b class="cover-label">GOAL → LOOP → DONE</b></div></div><div class="signal">${txt(c.signal)}</div>`,'cover')}
function singlePath(c){const nodes=c.steps.map((s,i)=>`${i?'<span class="arrow" aria-hidden="true">→</span>':''}<div class="node">${txt(s)}</div>`).join('');const body=c.body.map(v=>`<div class="panel">${txt(v)}</div>`).join('');return shell(c,`<p class="lead">${txt(c.lead)}</p><div class="path" role="img" aria-label="เส้นทางทำงานแบบลำดับเดียว">${nodes}</div><div class="path-body">${body}</div><div class="cursor-card">ปลายทางของคำตอบ = จุดเริ่มงานรอบต่อไปของเรา</div>`)}
function agentLoop(c){const cls=['goal','decide','act','observe','verify'];const nodes=c.steps.map((s,i)=>`<div class="loop-node ${cls[i]}">${txt(s)}</div>`).join('');return shell(c,`<p class="lead">${txt(c.lead)}</p><div class="loop-wrap" role="img" aria-label="วงจรเอเจนต์ตั้งแต่เป้าหมาย ตัดสินใจ ลงมือ สังเกต และตรวจสอบ"><div class="loop-ring" aria-hidden="true"></div>${nodes}<div class="loop-center">รับผลจริง<br>แล้วปรับ<br>ขั้นถัดไป</div><div class="signal loop-signal">${txt(c.signal)}</div></div>`)}
function notEqual(c){const panel=(side,data)=>`<div class="panel versus-panel ${side}"><h2>${txt(data.label)}</h2>${data.items.map(v=>`<div class="v-item">${txt(v)}</div>`).join('')}</div>`;return shell(c,`<div class="versus">${panel('left',c.left)}<div class="versus-mark">≠</div>${panel('right',c.right)}</div>`)}
function stack(c){const rows=c.items.map(([n,l,d])=>`<div class="stack-row"><b class="stack-num">${txt(n)}</b><b class="stack-label">${txt(l)}</b><span class="stack-desc">${txt(d)}</span></div>`).join('');return shell(c,`<p class="lead">${txt(c.lead)}</p><div class="stack">${rows}</div><div class="workflow-band"><b class="mono">WORKFLOW / RUNTIME</b> = ลำดับ · loop · approval · stopping condition</div>`)}
function report(c){const lane=(label,items,klass)=>`<div class="panel lane ${klass}"><h2>${label}</h2>${items.map((v,i)=>`<div class="lane-step"><i>${i+1}</i><span>${txt(v)}</span></div>`).join('')}</div>`;return shell(c,`<div class="lanes">${lane('CHAT ทั่วไป',c.chat,'chat')}${lane('AGENT',c.agent,'agent')}</div><div class="report-note">${txt(c.note)}</div>`)}
function whenChat(c){return shell(c,`<div class="checklist">${c.items.map(v=>`<div class="check"><i></i><span>${txt(v)}</span></div>`).join('')}</div><div class="signal simple-signal">${txt(c.signal)}</div>`)}
function whenAgent(c){return shell(c,`<div class="use-grid">${c.items.map(([l,d])=>`<div class="use"><b>${txt(l)}</b><span>${txt(d)}</span></div>`).join('')}</div><div class="agent-note">${txt(c.note)}</div>`)}
function bridge(c){return shell(c,`<p class="lead">${txt(c.lead)}</p><div class="bridge" role="img" aria-label="เอเจนต์เชื่อมต่อ resources, tools และ prompts ผ่าน MCP โดยมีการควบคุมระดับแอปพลิเคชันแยกต่างหาก"><div class="agent-box">AGENT</div><div class="mcp-bridge">MCP</div><div class="systems">${c.nodes.map(n=>`<div class="system-node">${txt(n)}</div>`).join('')}</div></div><div class="approval">APPLICATION-LEVEL CONTROL</div><p class="note">${txt(c.note)}</p>`)}
function decision(c){return shell(c,`<div class="decision">${c.choices.map(([q,a])=>`<div class="choice"><span>${txt(q)}</span><b>${txt(a)}</b></div>`).join('')}</div><div class="signal decision-signal">${txt(c.signal)}</div>`)}
function render(c){return ({'cover-loop':cover,'single-path':singlePath,'agent-loop':agentLoop,'not-equal':notEqual,'system-stack':stack,'report-example':report,'when-chat':whenChat,'when-agent':whenAgent,'mcp-bridge':bridge,'decision':decision}[c.template]??singlePath)(c)}
const requested=Number(new URLSearchParams(location.search).get('card')||1);const card=model.cards.find(c=>c.order===requested)??model.cards[0];document.getElementById('app').innerHTML=render(card);
</script></body></html>
