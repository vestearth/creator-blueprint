<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">แผนที่กลุ่มปุ่มของคีย์บอร์ด Full-size</title>
  <desc id="desc">แผนภาพคีย์บอร์ดแบบไม่อิงแบรนด์ แบ่งสี Core typing, Function row, Navigation, Arrows และ Numpad</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D19"/>
      <stop offset="1" stop-color="#101A2F"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#20304A" stroke-width="1" opacity=".28"/>
    </pattern>
    <pattern id="coreKeys" x="212" y="406" width="78" height="60" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="68" height="50" rx="10" fill="#1C2940" stroke="#33435E" stroke-width="2"/>
    </pattern>
    <pattern id="numKeys" x="1390" y="314" width="78" height="68" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="68" height="58" rx="10" fill="#3A2449" stroke="#E879F9" stroke-width="2" opacity=".92"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <g id="fkey">
      <rect width="62" height="54" rx="10" fill="#183B61" stroke="#4DA3FF" stroke-width="2"/>
    </g>
    <g id="navkey">
      <rect width="64" height="56" rx="10" fill="#4A351A" stroke="#FFB84D" stroke-width="2"/>
    </g>
    <g id="arrowkey">
      <rect width="64" height="56" rx="10" fill="#173D2B" stroke="#58D68D" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <text x="120" y="120" fill="#F4F7FB" font-family="Tahoma, Segoe UI, sans-serif" font-size="58" font-weight="700">Keyboard ไม่ได้มีแค่ “ปุ่มพิมพ์”</text>
  <text x="120" y="174" fill="#9AABC2" font-family="Tahoma, Segoe UI, sans-serif" font-size="30">แบ่งเป็น 5 กลุ่ม แล้วดูว่าแต่ละ Layout เก็บ ย้าย หรือตัดอะไรออก</text>

  <g filter="url(#shadow)">
    <rect x="120" y="240" width="1680" height="570" rx="36" fill="#121A2B" stroke="#2A3852" stroke-width="3"/>

    <g aria-label="Function row">
      <use href="#fkey" x="178" y="294"/><use href="#fkey" x="252" y="294"/><use href="#fkey" x="326" y="294"/>
      <use href="#fkey" x="400" y="294"/><use href="#fkey" x="474" y="294"/><use href="#fkey" x="548" y="294"/>
      <use href="#fkey" x="622" y="294"/><use href="#fkey" x="696" y="294"/><use href="#fkey" x="770" y="294"/>
      <use href="#fkey" x="844" y="294"/><use href="#fkey" x="918" y="294"/><use href="#fkey" x="992" y="294"/>
      <text x="178" y="282" fill="#4DA3FF" font-family="Tahoma, Segoe UI, sans-serif" font-size="23" font-weight="700">FUNCTION ROW</text>
    </g>

    <g aria-label="Core typing">
      <rect x="174" y="390" width="858" height="344" rx="20" fill="#131D30" stroke="#33435E" stroke-width="2"/>
      <rect x="212" y="406" width="780" height="300" rx="12" fill="url(#coreKeys)"/>
      <rect x="430" y="656" width="386" height="54" rx="12" fill="#263650" stroke="#65758D" stroke-width="2"/>
      <text x="174" y="380" fill="#9AABC2" font-family="Tahoma, Segoe UI, sans-serif" font-size="23" font-weight="700">CORE TYPING</text>
    </g>

    <g aria-label="Navigation">
      <text x="1088" y="380" fill="#FFB84D" font-family="Tahoma, Segoe UI, sans-serif" font-size="23" font-weight="700">NAVIGATION</text>
      <use href="#navkey" x="1088" y="406"/><use href="#navkey" x="1164" y="406"/><use href="#navkey" x="1240" y="406"/>
      <use href="#navkey" x="1088" y="474"/><use href="#navkey" x="1164" y="474"/><use href="#navkey" x="1240" y="474"/>
    </g>

    <g aria-label="Arrow cluster">
      <text x="1088" y="620" fill="#58D68D" font-family="Tahoma, Segoe UI, sans-serif" font-size="23" font-weight="700">ARROWS</text>
      <use href="#arrowkey" x="1164" y="634"/>
      <use href="#arrowkey" x="1088" y="702"/><use href="#arrowkey" x="1164" y="702"/><use href="#arrowkey" x="1240" y="702"/>
    </g>

    <g aria-label="Numpad">
      <text x="1374" y="282" fill="#E879F9" font-family="Tahoma, Segoe UI, sans-serif" font-size="23" font-weight="700">NUMPAD</text>
      <rect x="1370" y="294" width="360" height="440" rx="20" fill="#20172B" stroke="#6F3B7D" stroke-width="2"/>
      <rect x="1390" y="314" width="312" height="340" rx="12" fill="url(#numKeys)"/>
      <rect x="1394" y="654" width="144" height="58" rx="10" fill="#3A2449" stroke="#E879F9" stroke-width="2"/>
    </g>
  </g>

  <g transform="translate(120 886)" font-family="Tahoma, Segoe UI, sans-serif" font-size="25" fill="#F4F7FB">
    <circle cx="14" cy="0" r="14" fill="#4DA3FF"/><text x="40" y="9">F-row</text>
    <circle cx="218" cy="0" r="14" fill="#FFB84D"/><text x="244" y="9">Navigation</text>
    <circle cx="494" cy="0" r="14" fill="#58D68D"/><text x="520" y="9">Arrows</text>
    <circle cx="690" cy="0" r="14" fill="#E879F9"/><text x="716" y="9">Numpad</text>
    <circle cx="902" cy="0" r="14" fill="#A78BFA"/><text x="928" y="9">Fn / Layer</text>
  </g>
  <text x="1800" y="1014" text-anchor="end" fill="#65758D" font-family="Tahoma, Segoe UI, sans-serif" font-size="22">Brandless original diagram · v0</text>
</svg>
